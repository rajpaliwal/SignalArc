[project]
name = "signalarc-api"
version = "0.1.0"
description = "SignalArc backend API"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "neo4j>=6.1.0",
    "neomodel>=7.0.0",
    "openai>=3.6.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.52",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "alembic>=1.19.1",
]
